; Apex Chrono V1.5 — ESP32-S3-DevKitC-1 N32R16V + BN-880Q + ST7789 + microSD + BMI270
; Build:  pio run          Flash: pio run -t upload       Monitor: pio device monitor
; Host parity test of the timing core (no hardware): npm run firmware:test

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++17 -O2 -DBOARD_HAS_PSRAM
build_unflags = -std=gnu++11
; `esp32-s3-devkitc-1` is PlatformIO's plain N8 board definition (8 MB Quad
; flash, no PSRAM) -- there is no bundled N32R16V entry. N32R16V is the
; ESP32-S3-WROOM-2 module: 32 MB **Octal** flash + 16 MB Octal PSRAM, VDD_SPI
; 1.8 V (Espressif ESP32-S3-WROOM-2 datasheet, ordering table). Both memories
; are octal, so the Arduino memory type is opi_opi and the flash mode opi.
; (Task 3 had qio flash / qio_opi, which matches no 32 MB module: WROOM-1
; tops out at 16 MB Quad flash.) See docs/V1_5_HARDWARE.md §7.
; The partition table stays at the board default (8 MB layout) — the app is
; ~0.44 MB; the rest of the 32 MB is simply unused for now.
board_build.arduino.memory_type = opi_opi
board_build.flash_mode = opi
board_build.psram_type = opi
board_upload.flash_size = 32MB
lib_deps =
  mikalhart/TinyGPSPlus @ ^1.0.3
  adafruit/Adafruit GFX Library @ ^1.12.6
  adafruit/Adafruit BusIO @ ^1.17.4
  adafruit/Adafruit ST7735 and ST7789 Library @ ^1.11.0
  ; Only for the Bosch BMI270 Sensor API it ships (src/bmi270_api, v2.86.1,
  ; BSD-3) — that API carries Bosch's config file. firmware/lib/apex_imu
  ; calls the Bosch C API directly, not SparkFun's C++ wrapper.
  sparkfun/SparkFun BMI270 Arduino Library @ ^1.0.3
