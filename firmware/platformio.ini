; Apex Chrono V1.5 — ESP32-S3-DevKitC-1 N32R16V + BN-880Q + ST7789 + microSD + BMI270
; Build:  pio run          Flash: pio run -t upload       Monitor: pio device monitor
; Host parity test of the timing core (no hardware): npm run firmware:test

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags = -std=gnu++17 -O2 -DBOARD_HAS_PSRAM
build_unflags = -std=gnu++11
; `esp32-s3-devkitc-1` is PlatformIO's plain N8 board definition (8 MB flash,
; no PSRAM) -- there is no bundled N32R16V entry. The N32R16V's 32 MB QIO
; flash and 16 MB Octal PSRAM are declared here instead of a new board JSON;
; see docs/V1_5_HARDWARE.md for the full reasoning and the exact mechanism
; (psram_type=opi + the existing qio flash_mode select memory_type=qio_opi).
board_upload.flash_size = 32MB
board_build.psram_type = opi
lib_deps =
  mikalhart/TinyGPSPlus @ ^1.0.3
  adafruit/Adafruit GFX Library @ ^1.12.6
  adafruit/Adafruit BusIO @ ^1.17.4
  adafruit/Adafruit ST7735 and ST7789 Library @ ^1.11.0
