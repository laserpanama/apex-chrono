name: firmware

# Compiles the ESP32-S3 firmware with PlatformIO and runs the host-side C++
# tests (timing-core parity + display/IMU), on every push or PR that touches
# the firmware or the TS reference engine the parity fixtures come from.

on:
  push:
    paths: ["firmware/**", "src/lib/gnss/**", "package.json", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**", "src/lib/gnss/**", "package.json", ".github/workflows/firmware.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Host tests (parity + display/IMU)
        run: |
          set -o pipefail
          npm run firmware:test | tee host-tests.log
          echo "::notice title=host tests::$(grep -E '^(PASS|FAIL) ' host-tests.log | tr '\n' ' ')"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}

      - name: PlatformIO build (esp32-s3-devkitc-1, N32R16V overrides)
        run: |
          set -o pipefail
          pip install -q platformio
          cd firmware && pio run -v > pio.log 2>&1 || { tail -80 pio.log; exit 1; }
          grep -E '^(RAM|Flash):|SUCCESS|warning:|error:' pio.log || true
          # Sizes + resolved package versions as annotations (visible on the run page and via the API).
          echo "::notice title=firmware size::$(grep -E '^(RAM|Flash):' pio.log | tr -s ' ' | tr '\n' ' ')"
          echo "::notice title=platform::$(grep -E '^PLATFORM:|framework-arduinoespressif32|toolchain-xtensa' pio.log | tr -s ' ' | tr '\n' ' ')"
          # Which memory layout the Arduino core was built against (must be opi_opi for N32R16V).
          echo "::notice title=memory config::$(grep -oE 'sdk/esp32s3/[a-z_]+/include' pio.log | sort -u | tr '\n' ' ') $(grep -oE 'elf2image[^&]*--flash_mode [a-z]+[^&]*--flash_size [0-9A-Z]+' pio.log | grep -oE -- '--flash_(mode|freq|size) [0-9a-zA-Z]+' | sort -u | tr '\n' ' ') $(grep -oE 'bootloader[_a-z0-9]*\.(elf|bin)' pio.log | sort -u | tr '\n' ' ')"
          echo "::notice title=libraries::$(grep -E '^\|-- ' pio.log | tr -s ' ' | tr '\n' ' ')"
          OWN=$(grep 'warning:' pio.log | grep -E '(lib/apex_|src/main|include/pins)' | sort -u | head -5 | tr '\n' ' ' || true)
          echo "::notice title=compiler warnings::total=$(grep -c 'warning:' pio.log || true) own_code=[${OWN}]"
